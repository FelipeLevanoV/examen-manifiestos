apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: luis-felipe-09-namespace
  labels:
    app: frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 5173  # Redirige el tráfico del puerto 80 al 5173 del contenedor
      protocol: TCP
      name: http
      nodePort: 30001
  selector:
    app: frontend